; LoRa yer istasyonu köprüsü (30 Eyl 2026): Teensy 4.1 + E22-900T22D, bilgisayara USB ile bağlı.
; Bilgisayardaki arayüz bu Teensy'nin portuna bağlanır; köprü baytları olduğu gibi LoRa'ya aktarır.
; Yükleme (terminal de takılıysa yanlış karta gitmesin diye düğmeyle):
;   pio run -d tools/lora_koprusu -e teensy41   sonra teensy_loader_cli -mmcu=TEENSY41 -w -v .pio/build/teensy41/firmware.hex
;   ve YER İSTASYONU Teensy'sinin düğmesine bas
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -O2 -DUSB_SERIAL
