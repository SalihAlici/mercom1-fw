; Bağımsız BNO085 testi, Teensy 4.1 (29 Eyl 2026). Ana firmware'den ayrı; yüklenince kart sadece IMU okur.
; Kütüphane: kayıttaki ORİJİNAL Adafruit BNO08x (ana projedeki lib/ yamaları burada yok).
;   pio run -d tools/bno_teensy -e teensy41 -t upload
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_flags = -O2 -DUSB_SERIAL
lib_deps =
    adafruit/Adafruit BNO08x
