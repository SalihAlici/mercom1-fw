; Terminalden komutla motor surme. Ana firmware'den ayri; buraya yuklenince kart yalniz bu isi yapar.
[env:nucleo_h753zi]
platform = ststm32
board = nucleo_h753zi
framework = arduino
upload_protocol = mbed
monitor_speed = 115200
; yazdigin harfler ekranda gorunsun
monitor_echo = yes
; satir Enter ile gonderilsin
monitor_filters = send_on_enter
