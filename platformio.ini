; MERCOM-1 SoTM terminali yazılımı
; Kartlar: NUCLEO-H753ZI (MB1364, STM32duino) ve TEENSY 4.1 (plan B, 29 Eyl 2026)
;   pio run -e nucleo_h753zi           pio run -e teensy41 -t upload

[env:nucleo_h753zi]
platform = ststm32
board = nucleo_h753zi
framework = arduino
monitor_speed = 115200
; Nucleo'nun NOD_H753ZI sürücüsüne kopyalayarak yükler, ek sürücü gerekmez.
; ST-Link sürücüsü kuruluysa "stlink" da kullanılabilir.
upload_protocol = mbed
build_flags =
    -O2
    -Wall
    -DMERCOM_FW_VERSION=0x000100
    -DSERIAL_RX_BUFFER_SIZE=512
    -DSERIAL_TX_BUFFER_SIZE=1024
lib_deps =
    adafruit/Adafruit BNO08x
    teemuatlut/TMCStepper

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli
build_flags =
    -O2
    -Wall
    -DMERCOM_FW_VERSION=0x000101
    -DUSB_SERIAL
lib_deps =
    adafruit/Adafruit BNO08x
